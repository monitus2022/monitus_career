# pipeline/config.yaml — per-source settings for the daily run.
# Rolled out per §7: ctgoodjobs/recruit stay OFF until 2 consecutive green runs.
sources:
  hkgov:
    enabled: false       # user decision 2026-11-02: gov listing quality too
                         # low (≈50 % guards/cleaners, <$20k) for a python/
                         # eng profile; zero cross-source clusters with jobsdb.
                         # Re-enable by flipping to true (adapter kept, tested).
    list_paths:
      - /jobseeker/jobsearch/quickview/fulltime_epem/
      - /jobseeker/jobsearch/quickview/fulltime_na/
    pages: 1
  jobsdb:
    enabled: true
    keyword: ""          # overridden at run time by the profile recall hook
    pages: 1
  ctgoodjobs:
    enabled: false       # F4: ON after 2 consecutive green 4-source runs
  recruit:
    enabled: false       # F4: same

alerts:
  consecutive_source_failure_days: 2
  systemic_contract_failure_rate: 0.05
  coverage_drop_pp: 30.0

retention:
  seen_days: 90          # §6.6 purge rule
  raw_days: 90           # raw/<date>/<source>/ purge (E2)
